%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/wm,wm8505-ac97.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: WonderMedia WM8505 AC97 Audio Controller

maintainers:
  - Logan Russell <me@lrussell.net>

properties:
  compatible:
    const: wm,wm8505-ac97

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 2

  clock-names:
    items:
      - const: ac97
      - const: i2s

  dmas:
    items:
      - description: TX (playback) DMA channel
      - description: RX (capture) DMA channel

  dma-names:
    items:
      - const: tx
      - const: rx

  speaker-gpios:
    maxItems: 1
    description: GPIO for controlling the headphone/speaker amplifier

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - dmas
  - dma-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/wm8505-clock.h>
    #include <dt-bindings/gpio/gpio.h>

    ac97@d8290000 {
        compatible = "wm,wm8505-ac97";
        reg = <0xd8290000 0x10000>;
        interrupts = <42>;
        clocks = <&pmc WM8505_CLK_AC97>, <&pmc WM8505_CLK_I2S>;
        clock-names = "ac97", "i2s";
        dmas = <&dmac 18>, <&dmac 19>;
        dma-names = "tx", "rx";
        speaker-gpios = <&pinctrl 3 GPIO_ACTIVE_LOW>;
    };
