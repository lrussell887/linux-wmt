%YAML 1.2
---
$id: http://devicetree.org/schemas/display/wm,wm8505-drm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: WonderMedia WM8505 DRM/KMS Display Controller

maintainers:
  - Logan Russell <me@lrussell.net>

properties:
  compatible:
    const: wm,wm8505-drm

  reg:
    items:
      - description: Graphics Output (GOVRH) registers
      - description: Video Post Processor (VPP) registers

  reg-names:
    items:
      - const: govrh
      - const: vpp

  interrupts:
    maxItems: 1
    description: VPP vertical blanking interrupt

  clocks:
    maxItems: 4

  clock-names:
    items:
      - const: dvo
      - const: govrh
      - const: vpp
      - const: ge

  wm,ge:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the 2D Graphics Engine (GE) node

  port:
    $ref: /schemas/graph.yaml#/properties/port
    description: Output port endpoint for the display panel

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - clocks
  - clock-names
  - wm,ge

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/wm8505-clock.h>

    display@d8050800 {
        compatible = "wm,wm8505-drm";
        reg = <0xd8050800 0x200>, <0xd8050f00 0x100>;
        reg-names = "govrh", "vpp";
        interrupt-parent = <&intc1>;
        interrupts = <16>;
        clocks = <&pmc WM8505_CLK_DVO>,
                 <&pmc WM8505_CLK_GOVRHD>,
                 <&pmc WM8505_CLK_VPP>,
                 <&pmc WM8505_CLK_GE>;
        clock-names = "dvo", "govrh", "vpp", "ge";
        wm,ge = <&graphics>;

        port {
            display_out: endpoint {
                remote-endpoint = <&panel_in>;
            };
        };
    };
